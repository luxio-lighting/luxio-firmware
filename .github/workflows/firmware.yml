name: Firmware
on:
  pull_request:
  push:
    tags: ['firmware-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      chips: ${{ steps.targets.outputs.chips }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("chips=" + json.dumps([t["chip"] for t in json.load(open("targets.json"))]) + "\n")'
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJSON(needs.matrix.outputs.chips) }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: tools/bootstrap-firmware.sh
      - name: Build firmware and enforce image identity, partition sizes and stack budgets
        env:
          LUXIO_BUILD: ${{ github.run_number }}
          LUXIO_MATTER: '1'
        run: tools/build-firmware.sh '${{ matrix.chip }}'
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}-${{ github.run_number }}
          path: build/${{ matrix.chip }}/release/*
      # Compilation does not qualify a board for a public release.
      - name: Release validation gate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo 'Release blocked: complete Matter/GATT integration and hardware qualification (docs/release-status.md).'
          exit 1
