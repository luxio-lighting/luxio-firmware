name: Firmware
on:
  pull_request:
  push:
    tags: ['firmware-*']
  workflow_dispatch:
    inputs:
      build:
        description: Firmware build number (increase for each new release)
        type: number
        required: true
        default: 38
      publish:
        description: Upload binaries to MongoDB through the API and register updates
        type: boolean
        default: false
      channel:
        description: Publication channel (0 is available in Setup)
        type: choice
        options: ['100', '0']
        default: '100'
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      chips: ${{ steps.targets.outputs.chips }}
      build: ${{ steps.targets.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          BUILD_NUMBER: ${{ inputs.build || github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          build = int(os.environ['BUILD_NUMBER'])
          assert 0 < build <= 2147483647
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('chips=' + json.dumps([t['id'] for t in json.load(open('targets.json'))]) + '\n')
              output.write(f'build={build}\n')
          PY
  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJSON(needs.matrix.outputs.chips) }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for source SDK container and build
        if: matrix.chip == 'esp32' || matrix.chip == 'esp32c5' || matrix.chip == 'esp32c6'
        run: |
          # These preinstalled toolchains are unused on this disposable runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: arduino/setup-arduino-cli@v2
      - run: tools/bootstrap-firmware.sh
      - uses: actions/setup-node@v4
        if: matrix.chip == 'esp32'
        with:
          node-version: 24
      - name: Test signed OTA verifier for every chip
        if: matrix.chip == 'esp32'
        run: node tools/test-ota-signatures.mjs
      - name: Test configured Bluetooth names and queued renames
        if: matrix.chip == 'esp32'
        run: python3 tools/test-bluetooth-name.py
      - name: Build firmware and enforce image identity, partition sizes and stack budgets
        env:
          LUXIO_BUILD: ${{ needs.matrix.outputs.build }}
        run: tools/build-firmware.sh '${{ matrix.chip }}'
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}-${{ github.run_number }}
          path: build/${{ matrix.chip }}/release/*
      # Compilation does not qualify a board for a public release.
      - name: Release validation gate
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo 'Release blocked: complete Matter/GATT integration and hardware qualification (docs/release-status.md).'
          exit 1
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [matrix, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*-${{ github.run_number }}
          path: packages
      - name: Upload, verify downloads and register each chip
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
          LUXIO_CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          test -n "$UPDATE_PUBLISH_TOKEN" || { echo 'Configure UPDATE_PUBLISH_TOKEN in Actions secrets.'; exit 1; }
          for chip in $(python3 -c 'import json; print(" ".join(t["id"] for t in json.load(open("targets.json"))))'); do
            node tools/publish-update.mjs "packages/firmware-$chip-$RUN_NUMBER/manifest.local.json" --upload
          done
