syntax = "proto3";
package luxio;
option java_package = "lighting.luxio.protocol";
option java_multiple_files = true;

enum Operation {
  GET_STATE = 0;
  SET_COLOR = 1;
  SET_BRIGHTNESS = 2;
  SET_CONFIG = 3;
  SET_WIFI = 4;
  LIST_SCRIPTS = 5;
  GET_SCRIPT = 6; // Empty script_id returns the running animation source and current parameters.
  CREATE_SCRIPT = 7;
  UPDATE_SCRIPT = 8;
  DELETE_SCRIPT = 9;
  RUN_SCRIPT = 10;
  STOP_SCRIPT = 11;
  GET_PAIRING_CODE = 12;
  CHECK_UPDATE = 13;
  INSTALL_UPDATE = 14;
  SET_POWER = 15;
  SCAN_WIFI = 16;
  SET_GRADIENT = 17; // Live preview; does not write a library file.
  LIST_GRADIENTS = 18;
  GET_GRADIENT = 19;
  CREATE_GRADIENT = 20;
  UPDATE_GRADIENT = 21;
  DELETE_GRADIENT = 22;
  RUN_GRADIENT = 23;
  STOP_GRADIENT = 24;
  LIST_COLORS = 25;
  GET_COLOR = 26;
  CREATE_COLOR = 27;
  UPDATE_COLOR = 28;
  DELETE_COLOR = 29;
  RUN_COLOR = 30;
  SET_ANIMATION_PARAMETERS = 32; // Patch active values in RAM without restarting.
  SET_SCRIPT = 31; // Execute supplied Lua from RAM, without saving a script file.
}
enum Mode {
  COLOR = 0;
  GRADIENT = 1;
  ANIMATION = 2;
}
message Color {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
  uint32 white = 4;
  uint32 warm_white = 5;
  uint32 cool_white = 6;
}
// An absent relay leaves existing settings unchanged in SET_CONFIG.
// Send enabled=false explicitly to disable it. Older saved configs default off.
message RelayConfig { bool enabled = 1; uint32 gpio = 2; bool inverted = 3; }
// Omitted feature settings retain their current value. Both default enabled.
message FeatureConfig { bool enabled = 1; }
message Config {
  string name = 1;
  string strip_type = 2;
  uint32 led_count = 3;
  uint32 gpio = 4;
  uint32 channel = 5;
  RelayConfig relay = 6;
  FeatureConfig wifi = 7;
  FeatureConfig matter = 8;
}
message Wifi { string ssid = 1; string password = 2; }
message WifiNetwork { string ssid = 1; sint32 rssi = 2; bool password_required = 3; }
message AnimationParameter {
  string name = 1;
  bool boolean = 2; // True means Checkbox, with values 0 or 1. False means numeric.
  double value = 3;
  double default_value = 4;
  double minimum = 5;
  double maximum = 6;
  bool number_input = 7; // Numeric input instead of a slider; absent on older firmware.
}
message Script {
  repeated Color preview = 6; // Derived from -- @preview RGB hex colors; display hint only.
  string id = 1; string name = 2; string source = 3; Mode mode = 4; repeated AnimationParameter parameters = 5; }
message Gradient {
  string id = 1;
  string name = 2;
  repeated Color colors = 3; // 2–8 evenly spaced RGBCCT stops.
  string editor_metadata = 4; // Optional, non-executable editor data (UTF-8, at most 2048 bytes).
}
message SavedColor { string id = 1; string name = 2; Color color = 3; }
message State {
  bool matter_disabled = 17; // True when Matter is unavailable in this build or disabled by its RAM check; absent in older Matter-enabled firmware.
  uint32 animation_revision = 16; // Changes whenever an animation starts, including RAM-only replacements.
  repeated Color animation_preview = 15; // Active animation hint, including RAM-only animations.
  string device_id = 1;
  uint32 build = 2;
  Config config = 3;
  uint32 brightness = 4;
  Color color = 5;
  string active_script_id = 6;
  string lan_ip = 7;
  Mode mode = 8;
  bool on = 9;
  string active_gradient_id = 10;
  Gradient gradient = 11; // Current stops, including unsaved live edits; present only in Gradient mode.
  string active_color_id = 12;
  repeated AnimationParameter parameters = 14; // Active definitions and values.
  string script_name = 13; // Display name for the active animation, saved or in-memory.
}
message Request {
  uint32 id = 1;
  Operation operation = 2;
  Color color = 3;
  uint32 brightness = 4;
  Config config = 5;
  Wifi wifi = 6;
  Script script = 7;
  string script_id = 8;
  uint32 script_offset = 9; // LIST_SCRIPTS continuation; zero starts a listing.
  bool on = 10; // SET_POWER; brightness is independent (1–256).
  Gradient gradient = 11;
  string gradient_id = 12;
  uint32 gradient_offset = 13;
  SavedColor saved_color = 14;
  string color_id = 15;
  uint32 color_offset = 16;
  repeated AnimationParameter parameters = 17; // Values to patch; name/boolean/value are required logically.
}
// Read-only network diagnostics, reported with GET_STATE.
message NetworkStatus {
  bool connected = 1;
  sint32 rssi = 2;
  string bssid = 3;
  uint32 channel = 4;
  uint32 power_save = 5; // ESP-IDF: 0=none, 1=min modem, 2=max modem.
  uint32 uptime_ms = 6;
  uint32 internal_free = 7;
  uint32 internal_largest_block = 8;
  uint32 disconnect_count = 9;
  uint32 last_disconnect_reason = 10;
  string ssid = 11;
  string gateway = 12;
  repeated string dns = 13;
  uint32 psram_size = 14; // Successfully initialized external RAM, in bytes.
  uint32 psram_free = 15;
}
message Response {
  uint32 id = 1;
  string error = 2;
  State state = 3;
  repeated Script scripts = 4;
  Script script = 5;
  string pairing_code = 6;
  string pairing_qr = 7;
  uint32 available_build = 8;
  bool update_checking = 9;
  string update_error = 10;
  uint32 next_script_offset = 11; // Zero means the last page.
  repeated WifiNetwork wifi_networks = 12; // Strongest first; at most 32 distinct SSID/security pairs.
  bool wifi_scanning = 13; // SCAN_WIFI starts; GET_STATE polls without restarting.
  string wifi_scan_error = 14;
  repeated Gradient gradients = 15;
  Gradient gradient = 16;
  uint32 next_gradient_offset = 17;
  repeated SavedColor colors = 18;
  SavedColor saved_color = 19;
  uint32 next_color_offset = 20;
  NetworkStatus network_status = 21;
  string animation_error = 22; // Last runtime failure; GET_STATE, cleared when another animation starts.
}
